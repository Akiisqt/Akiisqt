name: Update Profile Stats

on:
  push:
    branches:
      - main
    paths:
      - 'profile.json'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Generate Cyber-Emo Stats GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/loader.py

      - name: Commit and Push Updated Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github_stats.gif
          if git diff --staged --quiet github_stats.gif; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date +%s)
            sed -i -E "s|github_stats\.gif(\?v=[0-9]+)?|github_stats.gif?v=${TIMESTAMP}|g" README.md
            git add README.md
            git commit -m "Auto-update profile stats [skip ci]"
            git push
          fi
